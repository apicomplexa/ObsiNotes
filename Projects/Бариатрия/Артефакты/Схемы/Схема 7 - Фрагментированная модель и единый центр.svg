<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 826" width="1240" height="826"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1240" height="826" fill="#ffffff"/><text x="620.0" y="40.0" font-family="DejaVu Sans" font-size="25.00" fill="#000000" text-anchor="middle" font-weight="bold">Схема 7. Фрагментированная модель и модель единого центра</text><text x="620.0" y="68.0" font-family="DejaVu Sans" font-size="17.00" fill="#333333" text-anchor="middle" font-style="italic">сравнение организационных схем ведения бариатрического пациента</text><rect x="24.0" y="92.0" width="592.0" height="700.0" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.4"/><rect x="24.0" y="92.0" width="592.0" height="48.0" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="320.0" y="121.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">А. Фрагментированная маршрутизация</text><rect x="624.0" y="92.0" width="592.0" height="700.0" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.4"/><rect x="624.0" y="92.0" width="592.0" height="48.0" rx="8" fill="#000000" stroke="#000000" stroke-width="2"/><text x="920.0" y="121.4" font-family="DejaVu Sans" font-size="18.00" fill="#ffffff" text-anchor="middle" font-weight="bold">Б. Единый центр бариатрии</text><text x="320.0" y="168.0" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle" font-style="italic">пациент самостоятельно связывает этапы</text><text x="920.0" y="168.0" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle" font-style="italic">маршрут ведёт организация, а не пациент</text><rect x="648.0" y="174.0" width="544.0" height="61.8" rx="5" fill="#e8e8e8" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="199.9" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Единая точка входа</text><text x="660.0" y="219.6" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">регистратура, горячая линия, электронная запись, маршрутный лист</text><line x1="920.0" y1="235.8" x2="920.0" y2="247.8" stroke="#000000" stroke-width="1.8" marker-end="url(#b)"/><rect x="648.0" y="249.8" width="544.0" height="61.8" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="275.6" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Модуль отбора и обследования</text><text x="660.0" y="295.3" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">скрининг и амбулаторный диагностический пакет за 2–3 визита</text><line x1="920.0" y1="311.5" x2="920.0" y2="323.5" stroke="#000000" stroke-width="1.8" marker-end="url(#b)"/><rect x="648.0" y="325.5" width="544.0" height="77.8" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="351.4" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Модуль мультидисциплинарной оценки</text><text x="660.0" y="371.1" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">эндокринолог, кардиолог, психиатр, диетолог, анестезиолог в одном месте;</text><text x="660.0" y="387.1" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">консилиум</text><line x1="920.0" y1="403.2" x2="920.0" y2="415.2" stroke="#000000" stroke-width="1.8" marker-end="url(#b)"/><rect x="648.0" y="417.2" width="544.0" height="61.8" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="443.1" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Операционный модуль</text><text x="660.0" y="462.8" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">стандартизованные вмешательства, протокол ERAS, хирургический аудит</text><line x1="920.0" y1="479.0" x2="920.0" y2="491.0" stroke="#000000" stroke-width="1.8" marker-end="url(#b)"/><rect x="648.0" y="493.0" width="544.0" height="61.8" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="518.9" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Модуль реабилитации и школы пациента</text><text x="660.0" y="538.6" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">пищевая реабилитация, ЛФК, психологическая поддержка, обучение</text><line x1="920.0" y1="554.8" x2="920.0" y2="566.8" stroke="#000000" stroke-width="1.8" marker-end="url(#b)"/><rect x="648.0" y="568.8" width="544.0" height="77.8" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="660.0" y="594.6" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Модуль пожизненного наблюдения</text><text x="660.0" y="614.3" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">регистр пациентов, активный вызов, телемедицина, аудит отдалённых</text><text x="660.0" y="630.3" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">исходов</text><rect x="50.0" y="196.0" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="218.0" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Поликлиника по месту</text><text x="145.0" y="234.3" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">жительства</text><line x1="183.5" y1="269.9" x2="267.5" y2="374.0" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="400.0" y="196.0" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="495.0" y="218.0" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Эндокринологический</text><text x="495.0" y="234.3" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">диспансер</text><line x1="456.5" y1="269.9" x2="372.5" y2="374.0" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="50.0" y="352.5" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="382.6" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Диагностический центр</text><line x1="183.5" y1="392.0" x2="267.5" y2="420.9" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="400.0" y="352.5" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="495.0" y="374.5" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Психиатрическая</text><text x="495.0" y="390.8" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">служба</text><line x1="456.5" y1="392.0" x2="372.5" y2="420.9" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="50.0" y="509.0" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="531.0" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Хирургический</text><text x="145.0" y="547.3" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">стационар</text><line x1="183.5" y1="514.1" x2="267.5" y2="467.9" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="400.0" y="509.0" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="495.0" y="531.0" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Реабилитация и</text><text x="495.0" y="547.3" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">наблюдение</text><line x1="456.5" y1="514.1" x2="372.5" y2="467.9" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="50.0" y="665.5" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="145.0" y="687.5" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Аптека, витамины,</text><text x="145.0" y="703.8" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">самоконтроль</text><line x1="183.5" y1="636.1" x2="267.5" y2="514.8" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><rect x="400.0" y="665.5" width="190.0" height="52.5" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="495.0" y="695.6" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle">Платные исследования</text><line x1="456.5" y1="636.1" x2="372.5" y2="514.8" stroke="#000000" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><circle cx="320.0" cy="439.0" r="54" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="320.0" y="435.0" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="middle" font-weight="bold">Пациент</text><text x="320.0" y="455.0" font-family="DejaVu Sans" font-size="11.50" fill="#000000" text-anchor="middle">координирует сам</text><text x="50.0" y="731.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">×  выпадение пациента между этапами</text><text x="50.0" y="748.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">×  повторные и просроченные исследования</text><text x="50.0" y="765.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">×  отсутствие единого ответственного за результат</text><text x="50.0" y="782.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">×  утрата наблюдения после выписки</text><text x="650.0" y="731.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">+  сокращение срока подготовки</text><text x="650.0" y="748.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">+  единая ответственность за исход</text><text x="650.0" y="765.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">+  полнота отдалённого наблюдения</text><text x="650.0" y="782.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start" font-style="italic">+  сопоставимость и учёт результатов</text></svg>
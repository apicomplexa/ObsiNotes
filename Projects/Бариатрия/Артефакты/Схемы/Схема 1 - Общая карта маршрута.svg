<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1364.75" width="1160" height="1364.75"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1160" height="1364.75" fill="#ffffff"/><text x="580.0" y="40.0" font-family="DejaVu Sans" font-size="25.00" fill="#000000" text-anchor="middle" font-weight="bold">Схема 1. Общая карта маршрута бариатрического пациента</text><text x="580.0" y="68.0" font-family="DejaVu Sans" font-size="17.00" fill="#333333" text-anchor="middle" font-style="italic">одиннадцать этапов, ответственный участник и ориентировочный срок каждого</text><text x="676.0" y="84.0" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Ответственный / срок</text><rect x="92.0" y="96.0" width="560.0" height="74.2" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="372.0" y="126.7" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 0. Информирование пациента</text><text x="372.0" y="151.4" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">источники сведений о хирургическом лечении ожирения</text><text x="686.0" y="126.9" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Первичное звено, школы пациента, СМИ, сайт центра</text><text x="686.0" y="148.0" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">постоянно</text><circle cx="54" cy="133.1" r="17" fill="#000000"/><text x="54.0" y="139.1" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">0</text><line x1="372.0" y1="170.2" x2="372.0" y2="200.2" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="204.2" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="234.9" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 1. Первичное обращение и скрининг</text><text x="372.0" y="259.6" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">ИМТ, анамнез, попытки консервативного лечения</text><text x="686.0" y="235.2" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Участковый терапевт, эндокринолог</text><text x="686.0" y="256.3" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">1 визит</text><circle cx="54" cy="241.4" r="17" fill="#000000"/><text x="54.0" y="247.4" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><line x1="372.0" y1="278.5" x2="372.0" y2="308.5" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="312.5" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="343.1" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 2. Консультация бариатрического хирурга</text><text x="372.0" y="367.9" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">подтверждение показаний, информирование о рисках</text><text x="686.0" y="343.4" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Хирург-бариатр</text><text x="686.0" y="364.5" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">1–2 недели</text><circle cx="54" cy="349.6" r="17" fill="#000000"/><text x="54.0" y="355.6" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><line x1="372.0" y1="386.8" x2="372.0" y2="416.8" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="420.8" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="451.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 3. Постановка в лист ожидания</text><text x="372.0" y="476.1" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">выбор источника финансирования, оформление документов</text><text x="686.0" y="451.7" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Врачебная комиссия, комиссия ОУЗ</text><text x="686.0" y="472.8" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">до 10 рабочих дней</text><circle cx="54" cy="457.9" r="17" fill="#000000"/><text x="54.0" y="463.9" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><line x1="372.0" y1="495.0" x2="372.0" y2="525.0" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="529.0" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="559.6" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 4. Догоспитальное обследование</text><text x="372.0" y="584.4" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">лабораторный и инструментальный комплекс</text><text x="686.0" y="559.9" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Врач-куратор (терапевт)</text><text x="686.0" y="581.0" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">3–6 недель</text><circle cx="54" cy="566.1" r="17" fill="#000000"/><text x="54.0" y="572.1" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><line x1="372.0" y1="603.2" x2="372.0" y2="633.2" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="637.2" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="667.9" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 5. Консультации МДТ</text><text x="372.0" y="692.6" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">включая психиатра-психотерапевта и диетолога</text><text x="686.0" y="668.2" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Мультидисциплинарная команда</text><text x="686.0" y="689.3" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">параллельно этапу 4</text><circle cx="54" cy="674.4" r="17" fill="#000000"/><text x="54.0" y="680.4" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><line x1="372.0" y1="711.5" x2="372.0" y2="741.5" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="745.5" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="776.1" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 6. Консилиум и информированное согласие</text><text x="372.0" y="800.9" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">допуск к операции, выбор вида вмешательства</text><text x="686.0" y="776.4" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">МДТ совместно с пациентом</text><text x="686.0" y="797.5" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">1 день</text><circle cx="54" cy="782.6" r="17" fill="#000000"/><text x="54.0" y="788.6" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><line x1="372.0" y1="819.8" x2="372.0" y2="849.8" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="853.8" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="884.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 7. Предоперационная подготовка</text><text x="372.0" y="909.1" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">снижение массы тела, компенсация коморбидности</text><text x="686.0" y="884.7" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Куратор, диетолог, анестезиолог</text><text x="686.0" y="905.8" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">2–4 недели; при ИМТ ≥ 50 — до 3 месяцев</text><circle cx="54" cy="890.9" r="17" fill="#000000"/><text x="54.0" y="896.9" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><line x1="372.0" y1="928.0" x2="372.0" y2="958.0" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="962.0" width="560.0" height="74.2" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="372.0" y="992.6" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 8. Госпитализация и операция</text><text x="372.0" y="1017.4" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">лапароскопическое вмешательство, протокол ERAS</text><text x="686.0" y="992.9" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Хирург, анестезиолог</text><text x="686.0" y="1014.0" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">3–5 койко-дней</text><circle cx="54" cy="999.1" r="17" fill="#000000"/><text x="54.0" y="1005.1" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text><line x1="372.0" y1="1036.2" x2="372.0" y2="1066.2" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="1070.2" width="560.0" height="74.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="372.0" y="1100.9" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 9. Ранний послеоперационный период</text><text x="372.0" y="1125.6" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">0–30 суток после выписки, пищевая реабилитация</text><text x="686.0" y="1101.2" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Куратор, служба поддержки пациента</text><text x="686.0" y="1122.3" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">1 месяц</text><circle cx="54" cy="1107.4" r="17" fill="#000000"/><text x="54.0" y="1113.4" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text><line x1="372.0" y1="1144.5" x2="372.0" y2="1174.5" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="92.0" y="1178.5" width="560.0" height="74.2" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="372.0" y="1209.2" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Этап 10. Отдалённое наблюдение</text><text x="372.0" y="1233.9" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle">пожизненный контроль дефицитов и массы тела</text><text x="686.0" y="1209.4" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start">Куратор, МДТ, регистр пациентов</text><text x="686.0" y="1230.5" font-family="DejaVu Sans" font-size="14.50" fill="#000000" text-anchor="start" font-style="italic">3, 6, 9, 12, 18, 24, 36 месяцев, далее ежегодно</text><circle cx="54" cy="1215.6" r="17" fill="#000000"/><text x="54.0" y="1221.6" font-family="DejaVu Sans" font-size="16.00" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text><polyline points="37.0,782.6 26.0,782.6 26.0,566.1 32.0,566.1" fill="none" stroke="#000000" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><rect x="92.0" y="1298.8" width="1044.0" height="52.0" rx="6" fill="#f5f5f5" stroke="#000000" stroke-width="1.5"/><text x="104.0" y="1321.2" font-family="DejaVu Sans" font-size="11.00" fill="#000000" text-anchor="start" font-style="italic">Пунктир — возвратная траектория: при отрицательном решении консилиума пациент возвращается на дообследование и коррекцию с указанием срока повторного</text><text x="104.0" y="1334.9" font-family="DejaVu Sans" font-size="11.00" fill="#000000" text-anchor="start" font-style="italic">рассмотрения. При неподтверждённых показаниях оформляется маршрут в консервативное лечение (схема 2).</text></svg>
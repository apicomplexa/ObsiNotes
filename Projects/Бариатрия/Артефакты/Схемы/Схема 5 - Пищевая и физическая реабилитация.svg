<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 750.7" width="1220" height="750.7"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1220" height="750.7" fill="#ffffff"/><text x="610.0" y="40.0" font-family="DejaVu Sans" font-size="25.00" fill="#000000" text-anchor="middle" font-weight="bold">Схема 5. Пищевая и физическая реабилитация после операции</text><text x="610.0" y="68.0" font-family="DejaVu Sans" font-size="17.00" fill="#333333" text-anchor="middle" font-style="italic">пять последовательных этапов расширения рациона и сквозные требования к режиму</text><rect x="12.0" y="92.0" width="228.0" height="50.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="126.0" y="112.9" font-family="DejaVu Sans" font-size="15.20" fill="#ffffff" text-anchor="middle" font-weight="bold">Этап I</text><text x="126.0" y="131.2" font-family="DejaVu Sans" font-size="12.35" fill="#ffffff" text-anchor="middle">0–2-е сутки</text><rect x="12.0" y="138.0" width="228.0" height="54.8" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="126.0" y="170.0" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Прозрачные жидкости</text><rect x="12.0" y="188.8" width="228.0" height="102.9" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="126.0" y="222.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">вода, несладкий отвар,</text><text x="126.0" y="240.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">бульон без жира</text><text x="126.0" y="266.6" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle" font-style="italic">30 мл каждые 15 минут</text><line x1="240.0" y1="117.0" x2="252.0" y2="117.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="254.0" y="92.0" width="228.0" height="50.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="368.0" y="112.9" font-family="DejaVu Sans" font-size="15.20" fill="#ffffff" text-anchor="middle" font-weight="bold">Этап II</text><text x="368.0" y="131.2" font-family="DejaVu Sans" font-size="12.35" fill="#ffffff" text-anchor="middle">3-и сутки — 2 недели</text><rect x="254.0" y="138.0" width="228.0" height="54.8" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="368.0" y="170.0" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Жидкое питание</text><rect x="254.0" y="188.8" width="228.0" height="102.9" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="368.0" y="213.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">кисломолочные напитки,</text><text x="368.0" y="231.3" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">белковые смеси, жидкие</text><text x="368.0" y="248.8" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">каши</text><text x="368.0" y="275.4" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle" font-style="italic">50–100 мл на приём</text><line x1="482.0" y1="117.0" x2="494.0" y2="117.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="496.0" y="92.0" width="228.0" height="50.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="610.0" y="112.9" font-family="DejaVu Sans" font-size="15.20" fill="#ffffff" text-anchor="middle" font-weight="bold">Этап III</text><text x="610.0" y="131.2" font-family="DejaVu Sans" font-size="12.35" fill="#ffffff" text-anchor="middle">2–4 недели</text><rect x="496.0" y="138.0" width="228.0" height="54.8" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="610.0" y="160.3" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Пюреобразное</text><text x="610.0" y="179.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">питание</text><rect x="496.0" y="188.8" width="228.0" height="102.9" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="610.0" y="222.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">протёртые овощи, творог,</text><text x="610.0" y="240.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">рыбное и мясное суфле</text><text x="610.0" y="266.6" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle" font-style="italic">100–120 мл на приём</text><line x1="724.0" y1="117.0" x2="736.0" y2="117.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="738.0" y="92.0" width="228.0" height="50.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="852.0" y="112.9" font-family="DejaVu Sans" font-size="15.20" fill="#ffffff" text-anchor="middle" font-weight="bold">Этап IV</text><text x="852.0" y="131.2" font-family="DejaVu Sans" font-size="12.35" fill="#ffffff" text-anchor="middle">4–8 недель</text><rect x="738.0" y="138.0" width="228.0" height="54.8" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="852.0" y="170.0" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Мягкая пища</text><rect x="738.0" y="188.8" width="228.0" height="102.9" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="852.0" y="222.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">тушёные овощи, яйцо,</text><text x="852.0" y="240.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">мягкое мясо, рыба</text><text x="852.0" y="266.6" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle" font-style="italic">120–150 мл на приём</text><line x1="966.0" y1="117.0" x2="978.0" y2="117.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="980.0" y="92.0" width="228.0" height="50.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="1094.0" y="112.9" font-family="DejaVu Sans" font-size="15.20" fill="#ffffff" text-anchor="middle" font-weight="bold">Этап V</text><text x="1094.0" y="131.2" font-family="DejaVu Sans" font-size="12.35" fill="#ffffff" text-anchor="middle">с 8-й недели</text><rect x="980.0" y="138.0" width="228.0" height="54.8" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="1094.0" y="160.3" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Обычная плотная</text><text x="1094.0" y="179.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">пища</text><rect x="980.0" y="188.8" width="228.0" height="102.9" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1094.0" y="222.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">рацион с приоритетом</text><text x="1094.0" y="240.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">белка, дробно, 5–6 раз</text><text x="1094.0" y="266.6" font-family="DejaVu Sans" font-size="13.00" fill="#000000" text-anchor="middle" font-style="italic">150–200 мл на приём</text><rect x="30.0" y="315.6" width="300.0" height="63.1" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/><text x="44.0" y="351.7" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Белок</text><rect x="338.0" y="315.6" width="852.0" height="63.1" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="352.0" y="342.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">не менее 60 г в сутки; при шунтирующих операциях 80–90 г; при недостижении цели — специализированные</text><text x="352.0" y="360.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">белковые смеси</text><rect x="30.0" y="386.8" width="300.0" height="45.5" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/><text x="44.0" y="413.8" font-family="DejaVu Sans" font-size="14.25" fill="#000000" text-anchor="start" font-weight="bold">Жидкость</text><rect x="338.0" y="386.8" width="852.0" height="45.5" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="352.0" y="413.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">не менее 1,5 л в сутки малыми глотками; не пить за 30 минут до еды и в течение 30 минут после еды</text><rect x="30.0" y="440.3" width="300.0" height="63.1" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/><text x="44.0" y="476.4" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Витамины и минералы</text><rect x="338.0" y="440.3" width="852.0" height="63.1" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="352.0" y="467.3" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">поливитаминный комплекс для бариатрических пациентов пожизненно; кальций, витамин D, витамин B12,</text><text x="352.0" y="484.8" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">железо — по схеме и результатам лабораторного контроля</text><rect x="30.0" y="511.4" width="300.0" height="63.1" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/><text x="44.0" y="547.4" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Физическая активность</text><rect x="338.0" y="511.4" width="852.0" height="63.1" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="352.0" y="538.4" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">ходьба с первых суток; 30 минут в день со 2-й недели; аэробная нагрузка с 4-й недели; силовые нагрузки и</text><text x="352.0" y="555.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">подъём тяжестей — не ранее 6–8 недель</text><rect x="30.0" y="582.5" width="300.0" height="63.1" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/><text x="44.0" y="618.5" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Лекарственная терапия</text><rect x="338.0" y="582.5" width="852.0" height="63.1" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="352.0" y="609.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">ингибиторы протонной помпы 1–3 месяца; урсодезоксихолевая кислота до 6 месяцев для профилактики</text><text x="352.0" y="627.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">желчнокаменной болезни; пересмотр доз препаратов по коморбидности</text><rect x="30.0" y="653.6" width="300.0" height="63.1" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/><text x="44.0" y="689.6" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-weight="bold">Что исключается</text><rect x="338.0" y="653.6" width="852.0" height="63.1" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="352.0" y="680.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">газированные напитки, алкоголь не менее 12 месяцев, крупные куски пищи, приём жидкости во время еды,</text><text x="352.0" y="698.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">НПВС без согласования с врачом</text></svg>
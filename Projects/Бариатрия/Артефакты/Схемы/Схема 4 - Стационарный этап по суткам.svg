<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 705.89" width="1300" height="705.89"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1300" height="705.89" fill="#ffffff"/><text x="650.0" y="40.0" font-family="DejaVu Sans" font-size="25.00" fill="#000000" text-anchor="middle" font-weight="bold">Схема 4. Стационарный этап: план по суткам</text><text x="650.0" y="68.0" font-family="DejaVu Sans" font-size="17.00" fill="#333333" text-anchor="middle" font-style="italic">типовой сценарий планового лапароскопического вмешательства без осложнений</text><rect x="16.0" y="92.0" width="244.0" height="46.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="138.0" y="120.4" font-family="DejaVu Sans" font-size="18.00" fill="#ffffff" text-anchor="middle" font-weight="bold">Сутки −1</text><rect x="16.0" y="134.0" width="244.0" height="42.0" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="138.0" y="159.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Госпитализация</text><rect x="16.0" y="172.0" width="244.0" height="203.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="30.0" y="194.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Осмотр хирурга и</text><text x="46.5" y="210.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">анестезиолога</text><text x="30.0" y="229.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Контроль результатов</text><text x="46.5" y="245.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">обследования</text><text x="30.0" y="265.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Подбор компрессионного</text><text x="46.5" y="281.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">трикотажа</text><text x="30.0" y="300.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Начало профилактики ВТЭО</text><text x="30.0" y="320.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Подписание согласий</text><text x="30.0" y="339.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Лёгкий ужин, далее голод</text><line x1="260.0" y1="115.0" x2="270.0" y2="115.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="272.0" y="92.0" width="244.0" height="46.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="394.0" y="120.4" font-family="DejaVu Sans" font-size="18.00" fill="#ffffff" text-anchor="middle" font-weight="bold">Сутки 0</text><rect x="272.0" y="134.0" width="244.0" height="42.0" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="394.0" y="159.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Операция</text><rect x="272.0" y="172.0" width="244.0" height="203.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="286.0" y="194.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Антибиотикопрофилактика</text><text x="302.5" y="210.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">за 30–60 минут</text><text x="286.0" y="229.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Лапароскопический доступ</text><text x="286.0" y="249.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Длительность 60–150 минут</text><text x="286.0" y="268.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Ранняя экстубация</text><text x="286.0" y="288.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Активизация через 4–6 часов</text><text x="286.0" y="307.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Обезболивание с</text><text x="302.5" y="323.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">минимизацией опиоидов</text><line x1="516.0" y1="115.0" x2="526.0" y2="115.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="528.0" y="92.0" width="244.0" height="46.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="650.0" y="120.4" font-family="DejaVu Sans" font-size="18.00" fill="#ffffff" text-anchor="middle" font-weight="bold">Сутки 1</text><rect x="528.0" y="134.0" width="244.0" height="42.0" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="650.0" y="159.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Ранняя активизация</text><rect x="528.0" y="172.0" width="244.0" height="203.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="542.0" y="194.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Подъём и ходьба по палате</text><text x="542.0" y="213.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Вода малыми глотками</text><text x="542.0" y="233.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Контроль пульса,</text><text x="558.5" y="249.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">температуры, диуреза</text><text x="542.0" y="268.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Тест на герметичность по</text><text x="558.5" y="284.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">показаниям</text><text x="542.0" y="304.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Дыхательная гимнастика</text><text x="542.0" y="323.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Продолжение</text><text x="558.5" y="339.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">тромбопрофилактики</text><line x1="772.0" y1="115.0" x2="782.0" y2="115.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="784.0" y="92.0" width="244.0" height="46.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="906.0" y="120.4" font-family="DejaVu Sans" font-size="18.00" fill="#ffffff" text-anchor="middle" font-weight="bold">Сутки 2</text><rect x="784.0" y="134.0" width="244.0" height="42.0" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="906.0" y="159.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Расширение режима</text><rect x="784.0" y="172.0" width="244.0" height="203.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="798.0" y="194.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Прозрачные жидкости по 30</text><text x="814.5" y="210.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">мл каждые 15 минут</text><text x="798.0" y="229.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Удаление дренажа, если он</text><text x="814.5" y="245.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">установлен</text><text x="798.0" y="265.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Контроль общего анализа</text><text x="814.5" y="281.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">крови и СРБ</text><text x="798.0" y="300.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Занятие с диетологом</text><text x="798.0" y="320.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Отмена инфузионной</text><text x="814.5" y="336.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">терапии</text><text x="798.0" y="355.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— ЛФК</text><line x1="1028.0" y1="115.0" x2="1038.0" y2="115.0" stroke="#000000" stroke-width="2" marker-end="url(#b)"/><rect x="1040.0" y="92.0" width="244.0" height="46.0" rx="6" fill="#000000" stroke="#000000" stroke-width="2"/><text x="1162.0" y="120.4" font-family="DejaVu Sans" font-size="18.00" fill="#ffffff" text-anchor="middle" font-weight="bold">Сутки 3–4</text><rect x="1040.0" y="134.0" width="244.0" height="42.0" rx="0" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="1162.0" y="159.7" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Выписка</text><rect x="1040.0" y="172.0" width="244.0" height="203.0" rx="0" fill="#ffffff" stroke="#000000" stroke-width="1.5"/><text x="1054.0" y="194.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Осмотр хирурга и куратора</text><text x="1054.0" y="213.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Письменные рекомендации</text><text x="1070.5" y="229.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">по питанию</text><text x="1054.0" y="249.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Назначение витаминов и ИПП</text><text x="1054.0" y="268.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Тромбопрофилактика на 2–4</text><text x="1070.5" y="284.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">недели</text><text x="1054.0" y="304.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Дата первого визита и</text><text x="1070.5" y="320.0" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">контакты</text><text x="1054.0" y="339.5" font-family="DejaVu Sans" font-size="12.50" fill="#000000" text-anchor="start">— Листок нетрудоспособности</text><rect x="30.0" y="395.0" width="1240.0" height="104.7" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="2"/><text x="44.0" y="423.8" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="start" font-weight="bold">Сквозные элементы протокола ускоренного восстановления (ERAS):</text><text x="44.0" y="446.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">отказ от длительного голодания и рутинной подготовки кишечника · углеводная нагрузка за 2 часа до операции · нормотермия и целевая инфузионная терапия ·</text><text x="44.0" y="463.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">мультимодальная анальгезия · профилактика тошноты и рвоты · отказ от рутинных дренажей и назогастрального зонда · активизация в день операции · раннее</text><text x="44.0" y="481.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">начало питья</text><rect x="30.0" y="513.6" width="1240.0" height="158.2" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.4"/><text x="48.0" y="543.6" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="start" font-weight="bold">Тревожные признаки, требующие немедленного обращения после выписки:</text><text x="44.0" y="568.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— стойкая тахикардия свыше 120 в минуту</text><text x="44.0" y="590.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— нарастающая боль в животе или в левом надплечье</text><text x="44.0" y="611.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— многократная рвота</text><text x="44.0" y="632.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— чёрный стул или рвота с кровью</text><text x="664.0" y="568.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— лихорадка выше 38 °C</text><text x="664.0" y="590.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— невозможность пить более 12 часов</text><text x="664.0" y="611.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— одышка, боль в грудной клетке</text><text x="664.0" y="632.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">— покраснение и отделяемое из раны</text><text x="650.0" y="657.9" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle" font-style="italic">Единый телефон дежурного хирурга и координатора выдаётся пациенту на руки при выписке</text></svg>
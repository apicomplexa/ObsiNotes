<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1003.25" width="1200" height="1003.25"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1200" height="1003.25" fill="#ffffff"/><text x="600.0" y="40.0" font-family="DejaVu Sans" font-size="25.00" fill="#000000" text-anchor="middle" font-weight="bold">Схема 2. Точки входа в маршрут и порядок постановки в очередь</text><text x="600.0" y="68.0" font-family="DejaVu Sans" font-size="17.00" fill="#333333" text-anchor="middle" font-style="italic">четыре канала первичного обращения и три механизма получения помощи</text><rect x="18.0" y="92.0" width="276.0" height="96.0" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="2"/><text x="156.0" y="126.2" font-family="DejaVu Sans" font-size="17.00" fill="#000000" text-anchor="middle" font-weight="bold">Самообращение</text><text x="156.0" y="148.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">сайт центра, горячая линия, школа</text><text x="156.0" y="165.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">пациента</text><polyline points="156.0,188.0 156.0,212.0 600.0,212.0 600.0,236.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="314.0" y="92.0" width="276.0" height="96.0" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="2"/><text x="452.0" y="126.2" font-family="DejaVu Sans" font-size="17.00" fill="#000000" text-anchor="middle" font-weight="bold">Участковый терапевт</text><text x="452.0" y="148.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">диспансеризация,</text><text x="452.0" y="165.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">профилактический осмотр</text><polyline points="452.0,188.0 452.0,212.0 600.0,212.0 600.0,236.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="610.0" y="92.0" width="276.0" height="96.0" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="2"/><text x="748.0" y="126.2" font-family="DejaVu Sans" font-size="17.00" fill="#000000" text-anchor="middle" font-weight="bold">Врач-эндокринолог</text><text x="748.0" y="148.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">наблюдение по поводу ожирения и</text><text x="748.0" y="165.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">СД 2 типа</text><polyline points="748.0,188.0 748.0,212.0 600.0,212.0 600.0,236.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="906.0" y="92.0" width="276.0" height="96.0" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="2"/><text x="1044.0" y="126.2" font-family="DejaVu Sans" font-size="17.00" fill="#000000" text-anchor="middle" font-weight="bold">Иной специалист</text><text x="1044.0" y="148.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">кардиолог, гинеколог, сомнолог,</text><text x="1044.0" y="165.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">ортопед</text><polyline points="1044.0,188.0 1044.0,212.0 600.0,212.0 600.0,236.0" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="320.0" y="236.0" width="560.0" height="91.8" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="600.0" y="267.6" font-family="DejaVu Sans" font-size="19.00" fill="#000000" text-anchor="middle" font-weight="bold">Первичный скрининг</text><text x="600.0" y="291.7" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle">ИМТ; длительность и степень ожирения; ассоциированные</text><text x="600.0" y="309.2" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle">заболевания; документированные попытки консервативного лечения</text><line x1="600.0" y1="327.8" x2="600.0" y2="359.8" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><polygon points="600.0,359.75 800.0,417.75 600.0,475.75 400.0,417.75" fill="#f5f5f5" stroke="#000000" stroke-width="2"/><text x="600.0" y="402.6" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="middle" font-weight="bold">Критерии к</text><text x="600.0" y="423.4" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="middle" font-weight="bold">бариатрической операции</text><text x="600.0" y="444.2" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="middle" font-weight="bold">подтверждены?</text><line x1="400.0" y1="417.8" x2="296.0" y2="417.8" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><text x="339.0" y="407.8" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="middle" font-style="italic">нет</text><rect x="18.0" y="370.2" width="260.0" height="95.1" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="1.7" stroke-dasharray="6 5"/><text x="148.0" y="395.1" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle" font-weight="bold">Консервативное лечение:</text><text x="148.0" y="415.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">диетолог, эндокринолог,</text><text x="148.0" y="432.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">фармакотерапия; повторная</text><text x="148.0" y="448.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">оценка через 6–12 месяцев</text><line x1="600.0" y1="475.8" x2="600.0" y2="509.8" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><text x="614.0" y="497.8" font-family="DejaVu Sans" font-size="15.00" fill="#000000" text-anchor="start" font-style="italic">да</text><rect x="320.0" y="509.8" width="560.0" height="89.5" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="600.0" y="540.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Консультация бариатрического хирурга</text><text x="600.0" y="563.2" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle">оформление медицинской документации, выбор источника</text><text x="600.0" y="580.7" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle">финансирования</text><polyline points="600.0,599.2 600.0,625.2 216.0,625.2 216.0,645.2" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="36.0" y="645.2" width="360.0" height="176.5" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="216.0" y="674.5" font-family="DejaVu Sans" font-size="16.50" fill="#000000" text-anchor="middle" font-weight="bold">Высокотехнологичная</text><text x="216.0" y="695.1" font-family="DejaVu Sans" font-size="16.50" fill="#000000" text-anchor="middle" font-weight="bold">медицинская помощь (ВМП)</text><text x="216.0" y="719.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">Направление и выписка → врачебная</text><text x="216.0" y="735.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">комиссия → комиссия органа управления</text><text x="216.0" y="752.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">здравоохранением → талон на оказание ВМП</text><text x="216.0" y="769.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">в подсистеме ЕГИСЗ → решение</text><text x="216.0" y="786.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">принимающей клиники в срок до 7 рабочих</text><text x="216.0" y="803.4" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">дней</text><polyline points="216.0,821.8 216.0,847.8 600.0,847.8 600.0,873.8" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><polyline points="600.0,599.2 600.0,625.2 600.0,625.2 600.0,645.2" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="420.0" y="645.2" width="360.0" height="176.5" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="600.0" y="683.0" font-family="DejaVu Sans" font-size="16.50" fill="#000000" text-anchor="middle" font-weight="bold">Специализированная помощь в</text><text x="600.0" y="703.6" font-family="DejaVu Sans" font-size="16.50" fill="#000000" text-anchor="middle" font-weight="bold">рамках ОМС</text><text x="600.0" y="727.4" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">Направление формы 057/у-04 из</text><text x="600.0" y="744.3" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">медицинской организации по месту</text><text x="600.0" y="761.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">прикрепления → запись в лист ожидания</text><text x="600.0" y="778.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">плановой госпитализации в сроки</text><text x="600.0" y="794.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">территориальной программы ОМС</text><polyline points="600.0,821.8 600.0,847.8 600.0,847.8 600.0,873.8" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><polyline points="600.0,599.2 600.0,625.2 984.0,625.2 984.0,645.2" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="804.0" y="645.2" width="360.0" height="176.5" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="984.0" y="691.4" font-family="DejaVu Sans" font-size="16.50" fill="#000000" text-anchor="middle" font-weight="bold">Платные медицинские услуги и</text><text x="984.0" y="712.0" font-family="DejaVu Sans" font-size="16.50" fill="#000000" text-anchor="middle" font-weight="bold">ДМС</text><text x="984.0" y="735.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">Договор с медицинской организацией;</text><text x="984.0" y="752.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">информирование о полной стоимости</text><text x="984.0" y="769.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">лечения и об объёме послеоперационного</text><text x="984.0" y="786.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="middle">наблюдения до подписания договора</text><polyline points="984.0,821.8 984.0,847.8 600.0,847.8 600.0,873.8" fill="none" stroke="#000000" stroke-width="2.2" marker-end="url(#a)"/><rect x="290.0" y="873.8" width="620.0" height="89.5" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="600.0" y="904.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Лист ожидания и дата госпитализации</text><text x="600.0" y="927.2" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle">пациент получает письменный маршрутный лист с датами обследований и</text><text x="600.0" y="944.7" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle">контактом координатора</text></svg>
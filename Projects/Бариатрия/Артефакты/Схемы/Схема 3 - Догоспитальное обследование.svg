<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 813.6750000000001" width="1200" height="813.6750000000001"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1200" height="813.6750000000001" fill="#ffffff"/><text x="600.0" y="40.0" font-family="DejaVu Sans" font-size="25.00" fill="#000000" text-anchor="middle" font-weight="bold">Схема 3. Догоспитальное обследование: три параллельных потока</text><text x="600.0" y="68.0" font-family="DejaVu Sans" font-size="17.00" fill="#333333" text-anchor="middle" font-style="italic">выполняются одновременно, что сокращает срок подготовки с 3–4 месяцев до 3–6 недель</text><rect x="14.0" y="92.0" width="376.0" height="52.0" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="202.0" y="123.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Лабораторные исследования</text><rect x="14.0" y="154.0" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="26.0" y="187.8" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Общий анализ крови, общий анализ мочи</text><rect x="14.0" y="222.1" width="376.0" height="76.7" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="26.0" y="247.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Биохимия: белок, альбумин, АЛТ, АСТ,</text><text x="26.0" y="264.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">билирубин, креатинин с расчётом СКФ,</text><text x="26.0" y="282.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">мочевина, мочевая кислота</text><rect x="14.0" y="307.8" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="26.0" y="332.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Липидный спектр; глюкоза натощак, HbA1c,</text><text x="26.0" y="350.3" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">инсулин, С-пептид, индекс HOMA-IR</text><rect x="14.0" y="375.9" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="26.0" y="400.8" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">ТТГ, свободный Т4, АКТГ, кортизол суточной</text><text x="26.0" y="418.4" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">мочи, пролактин, тестостерон (у мужчин)</text><rect x="14.0" y="444.0" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="26.0" y="468.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Ферритин, железо, витамин B12, фолаты,</text><text x="26.0" y="486.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">витамин D, кальций, паратгормон</text><rect x="14.0" y="512.1" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="26.0" y="537.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Коагулограмма, группа крови и резус-фактор,</text><text x="26.0" y="554.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">маркёры гемотрансмиссивных инфекций</text><rect x="412.0" y="92.0" width="376.0" height="52.0" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="600.0" y="123.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Инструментальные исследования</text><rect x="412.0" y="154.0" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="424.0" y="187.8" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">ЭГДС с биопсией и тестом на H. pylori</text><rect x="412.0" y="222.1" width="376.0" height="76.7" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="424.0" y="264.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">ЭКГ, эхокардиография</text><rect x="412.0" y="307.8" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="424.0" y="332.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">УЗИ органов брюшной полости и почек;</text><text x="424.0" y="350.3" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">эластометрия (фиброскан) печени</text><rect x="412.0" y="375.9" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="424.0" y="409.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">УЗИ вен нижних конечностей</text><rect x="412.0" y="444.0" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="424.0" y="468.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Рентгенография органов грудной клетки,</text><text x="424.0" y="486.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">спирометрия</text><rect x="412.0" y="512.1" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="424.0" y="545.8" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">УЗИ органов малого таза (у женщин)</text><rect x="810.0" y="92.0" width="376.0" height="52.0" rx="8" fill="#e8e8e8" stroke="#000000" stroke-width="2"/><text x="998.0" y="123.4" font-family="DejaVu Sans" font-size="18.00" fill="#000000" text-anchor="middle" font-weight="bold">Консультации специалистов</text><rect x="810.0" y="154.0" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="822.0" y="179.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Врач-куратор (терапевт) — координация</text><text x="822.0" y="196.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">маршрута и допуск к операции</text><rect x="810.0" y="222.1" width="376.0" height="76.7" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="822.0" y="255.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Эндокринолог — коррекция СД 2 типа и иной</text><text x="822.0" y="273.4" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">эндокринной патологии</text><rect x="810.0" y="307.8" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="822.0" y="332.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Кардиолог — оценка сердечно-сосудистого</text><text x="822.0" y="350.3" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">риска</text><rect x="810.0" y="375.9" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="822.0" y="409.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Гастроэнтеролог — ГЭРБ, НАЖБП, H. pylori</text><rect x="810.0" y="444.0" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="822.0" y="468.9" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Психиатр-психотерапевт — расстройства</text><text x="822.0" y="486.5" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">пищевого поведения, мотивация</text><rect x="810.0" y="512.1" width="376.0" height="59.1" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="822.0" y="537.0" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">Диетолог, гинеколог (у женщин),</text><text x="822.0" y="554.6" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">анестезиолог-реаниматолог</text><rect x="30.0" y="594.2" width="1140.0" height="104.7" rx="8" fill="#f5f5f5" stroke="#000000" stroke-width="1.7" stroke-dasharray="7 5"/><text x="44.0" y="623.0" font-family="DejaVu Sans" font-size="16.00" fill="#000000" text-anchor="start" font-weight="bold">Дополнительно по показаниям:</text><text x="44.0" y="645.1" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">пероральный глюкозотолерантный тест · суточное мониторирование АД · холтеровское мониторирование ЭКГ · стресс-эхокардиография при подозрении</text><text x="44.0" y="662.7" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">на ИБС · ночная пульсоксиметрия и полисомнография при подозрении на СОАС · денситометрия · КТ органов брюшной полости · консультации</text><text x="44.0" y="680.2" font-family="DejaVu Sans" font-size="13.50" fill="#000000" text-anchor="start">сомнолога, нефролога, ортопеда, сосудистого хирурга</text><rect x="30.0" y="710.8" width="1140.0" height="68.9" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="600.0" y="739.1" font-family="DejaVu Sans" font-size="15.50" fill="#000000" text-anchor="middle" font-weight="bold">Все результаты собирает и контролирует врач-куратор; объём обследования корректируется индивидуально</text><text x="600.0" y="761.1" font-family="DejaVu Sans" font-size="14.00" fill="#000000" text-anchor="middle" font-style="italic">Ориентировочная длительность этапа — 3–6 недель; сроки годности исследований отслеживает медицинская организация, а не пациент</text></svg>
# Общие настройки pandoc для экспорта из хранилища. Подключается плагином obsidian-pandoc
# (extraArguments: --defaults=<хранилище>/_.Settings/Pandoc/pandoc-defaults.yaml); стиль DOCX
# добавляет поверх макрос «Export: DOC» из obsidian-kit.
# ${.} — папка этого файла: пути одинаково работают на любой машине.
resource-path: ["${.}/../.."]

# Библиография задаётся во frontmatter конкретной заметки:
#   bibliography: "C:/путь/к/файлу.json|.bib"
# Здесь она НЕ задаётся намеренно: значение из defaults-файла перекрывает метаданные
# документа (проверено на pandoc 3.8.3), и заметка не может подставить свою библиографию.
#
# Глобальная выгрузка Better BibTeX лежит в
#   C:\Users\alex\Clouds\NextCloud\Library\zotero_lib.bib
# и на 27-09-2026 для citeproc непригодна по двум причинам:
#   1. 28 записей выгружены без citation key (`@article{` без ключа) — citeproc роняет
#      разбор всего файла на первой же такой записи;
#   2. авто-экспорт включён с опцией asciiBibLaTeX, которая превращает кириллицу
#      в \cyrchar\CYRF… — citeproc такие макросы не разворачивает, и русские источники
#      остаются без текста.
# Когда обе причины будут устранены в Zotero, строку ниже можно раскомментировать.
# bibliography: "C:\\Users\\alex\\Clouds\\NextCloud\\Library\\zotero_lib.bib"
csl: "${.}/gost-r-7-0-5-2008-numeric-alphabetical.csl"
# template: "${.}/article.tplx"
